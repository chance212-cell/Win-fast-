<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Win Fast — Demo</title>
<style>
:root{--bg:#061116;--panel:#0c1b21;--panel2:#10252d;--green:#14e548;--yellow:#ffd51a;--muted:#91a4ab;--line:#1b343c}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 65% 0,#123b25 0,#061116 34%);color:#fff}button{font:inherit;cursor:pointer;border:0}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{background:#061015;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh}.logo{font-size:27px;font-weight:900;font-style:italic;margin:5px 10px 25px}.logo span{color:var(--green)}.tag{font-size:10px;color:#b9c6ca;margin-left:11px;margin-top:-23px;margin-bottom:25px}.nav button{display:flex;gap:12px;width:100%;padding:13px 12px;margin:4px 0;background:transparent;color:#d8e0e3;border-radius:10px;text-align:left}.nav button.active,.nav button:hover{background:#063d25;color:#fff}.main{min-width:0}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:0 25px;background:#071318cc;backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}.top .links{display:flex;gap:22px;font-weight:700}.top .links span{cursor:pointer}.top .links span:hover{color:var(--green)}.actions{margin-left:auto;display:flex;gap:10px}.btn{padding:11px 18px;border-radius:8px;font-weight:800}.login{background:var(--green);color:#001708}.register{background:var(--yellow);color:#151000}.content{padding:24px;max-width:1450px;margin:auto}.hero{border-radius:14px;min-height:250px;padding:35px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;background:linear-gradient(110deg,#071d16,#0b5427 58%,#092219);border:1px solid #174b31;position:relative}.hero:after{content:'⚽';position:absolute;right:27%;font-size:170px;opacity:.08}.hero h1{font-size:52px;margin:0;font-style:italic}.hero h1 span{color:var(--green)}.hero p{font-size:18px;color:#d3dcdc}.cta{background:var(--yellow);padding:14px 28px;border-radius:25px;font-weight:900}.bonus{font-size:24px;font-weight:900;text-align:right}.bonus b{display:block;color:var(--yellow);font-size:64px}.sports{display:flex;gap:10px;overflow:auto;padding:18px 0}.sport{min-width:105px;background:var(--panel);border:1px solid var(--line);padding:14px 10px;border-radius:10px;text-align:center}.sport.active{background:#08b83b;color:#001707}.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px}.card{background:#0a1920;border:1px solid var(--line);border-radius:12px;overflow:hidden}.card h2{font-size:17px;margin:0;padding:16px;border-bottom:1px solid var(--line)}.match{display:grid;grid-template-columns:1fr repeat(3,75px) 25px;gap:8px;align-items:center;padding:13px 14px;border-bottom:1px solid #132a31}.match:last-child{border:0}.teams{font-weight:800}.teams small{display:block;color:var(--muted);font-weight:500;margin-top:5px}.odd{background:#12262e;border-radius:7px;padding:11px 5px;text-align:center;color:var(--green);font-weight:900}.games{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}.game{height:105px;border-radius:10px;display:flex;align-items:end;padding:12px;font-weight:900;background:linear-gradient(145deg,#35125b,#1b0b31)}.game:nth-child(2){background:linear-gradient(145deg,#601b23,#1b1014)}.game:nth-child(3){background:linear-gradient(145deg,#174c1c,#0d2312)}.game:nth-child(4){background:linear-gradient(145deg,#743014,#21140e)}.game:nth-child(5){background:linear-gradient(145deg,#233c78,#10182d)}.game:nth-child(6){background:linear-gradient(145deg,#713b0d,#241707)}.slip{padding:15px}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:9px;border-radius:7px;background:#12262e;color:#b9c5c9}.tabs button.active{background:#0fd543;color:#001407}.empty{text-align:center;color:var(--muted);padding:35px 10px}.wallet{margin:14px;padding:16px;border-radius:10px;background:#0d3321}.balance{font-size:25px;font-weight:900;margin:8px 0 15px}.wallet button{background:var(--green);padding:10px 14px;border-radius:7px;font-weight:800}.section{margin-top:18px}.mobilebar{display:none}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20}.modal.show{display:flex}.modalbox{background:#0b1b21;border:1px solid #24434c;border-radius:14px;padding:25px;width:min(420px,92vw)}.modalbox input{width:100%;padding:13px;margin:8px 0;background:#071318;border:1px solid var(--line);border-radius:8px;color:#fff}.modalbox .btn{width:100%;margin-top:10px}.close{float:right;color:#aebdc1;background:none;font-size:22px}
@media(max-width:850px){.app{display:block}.side{display:none}.top{height:60px;padding:0 14px}.top .links{display:none}.content{padding:12px;padding-bottom:75px}.hero{min-height:220px;padding:25px}.hero h1{font-size:38px}.bonus{font-size:16px}.bonus b{font-size:45px}.grid{grid-template-columns:1fr}.grid .right{order:-1}.games{grid-template-columns:repeat(2,1fr)}.match{grid-template-columns:1fr repeat(3,58px) 18px;font-size:13px}.odd{padding:9px 2px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#071318f5;border-top:1px solid var(--line);z-index:10;justify-content:space-around;padding:8px}.mobilebar button{background:none;color:#aebcc0;font-size:11px}.mobilebar button.active{color:var(--green)} }
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="logo">WIN<span>⚡FAST</span></div><div class="tag">Play Smart, Win Fast.</div><nav class="nav" id="sideNav"></nav></aside>
<main class="main"><header class="top"><div class="logo">WIN<span>⚡FAST</span></div><div class="links"><span onclick="show('Home')">Home</span><span onclick="show('Sports')">Sports</span><span onclick="show('Games')">Games</span><span onclick="show('Promotions')">Promotions</span><span onclick="show('My Bets')">My Bets</span><span onclick="show('Wallet')">Wallet</span></div><div class="actions"><button class="btn login" onclick="modal('Login')">Login</button><button class="btn register" onclick="modal('Register')">Register</button></div></header>
<section class="content" id="content"></section></main></div>
<div class="mobilebar"><button onclick="show('Home')">⌂<br>Home</button><button onclick="show('Sports')">⚽<br>Sports</button><button onclick="show('Games')">🎮<br>Games</button><button onclick="show('My Bets')">▣<br>My Bets</button><button onclick="show('Wallet')">▱<br>Wallet</button></div>
<div class="modal" id="modal"><div class="modalbox"><button class="close" onclick="modalClose()">×</button><h2 id="modalTitle">Login</h2><input placeholder="Phone or email"><input type="password" placeholder="Password"><button class="btn login" onclick="modalClose();toast('Demo only — no real account created.')">Continue</button></div></div>
<script>
const nav=['⌂ Home','⚽ Sports','🎮 Games','♠ Live Casino','◎ Virtuals','🎁 Promotions','▣ My Bets','▱ Wallet','◉ Support'];
const navEl=document.getElementById('sideNav'); navEl.innerHTML=nav.map(x=>{let [i,...r]=x.split(' '),t=r.join(' ');return `<button onclick="show('${t}')" class="${t==='Home'?'active':''}">${i}<span>${t}</span></button>`}).join('');
const matches=[['Real Madrid','Barcelona','2.15','3.40','3.10'],['Manchester City','Liverpool','1.95','3.60','3.75'],['Bayern Munich','Borussia Dortmund','1.80','3.80','4.20'],['Arsenal','Chelsea','2.05','3.25','3.55']];
function home(){return `<div class="hero"><div><h1>WIN<span>⚡FAST</span></h1><p>Play Smart. Win Fast.</p><button class="cta" onclick="show('Sports')">BET NOW →</button></div><div class="bonus">WELCOME BONUS<b>200%</b></div></div><div class="sports">${['▦ All','⚽ Football','🏀 Basketball','🎾 Tennis','🏐 Volleyball','⚾ Baseball','🏒 Ice Hockey'].map((x,i)=>`<div class="sport ${i===0?'active':''}">${x}</div>`).join('')}</div><div class="grid"><div><div class="card"><h2>🔥 Top Events</h2>${matches.map(m=>`<div class="match"><div class="teams">${m[0]}<br>${m[1]}<small>Today · Live</small></div>${m.slice(2).map(o=>`<button class="odd" onclick="addBet('${m[0]} vs ${m[1]}',${o})">${o}</button>`).join('')}<b>›</b></div>`).join('')}</div></div><div class="right"><div class="card"><h2>🎮 Popular Games</h2><div class="games">${['🚀 Crash','✈ Aviator','🎲 Dice','💣 Mines','🔺 Plinko','7️⃣ Slots'].map(x=>`<div class="game">${x}</div>`).join('')}</div></div><div class="card section"><h2>Bet Slip</h2><div class="slip"><div class="tabs"><button class="active">Single</button><button>Multi</button><button>System</button></div><div id="bets" class="empty">No selections yet</div></div></div></div></div>`}
function show(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.innerText.trim()===page)); if(page==='Home'||page==='Sports') document.getElementById('content').innerHTML=home(); else if(page==='Games')document.getElementById('content').innerHTML=`<div class="card"><h2>🎮 Games</h2><div class="games">${['🚀 Crash','✈ Aviator','🎲 Dice','💣 Mines','🔺 Plinko','7️⃣ Slots','🎯 Keno','🃏 Cards'].map(x=>`<div class="game">${x}</div>`).join('')}</div></div>`; else if(page==='Wallet')document.getElementById('content').innerHTML=`<div class="card"><h2>▱ Wallet</h2><div class="wallet"><small>Wallet Balance</small><div class="balance">RWF 125,000.00</div><button onclick="toast('Demo deposit screen')">Deposit</button> <button onclick="toast('Demo withdrawal screen')">Withdraw</button></div></div>`; else document.getElementById('content').innerHTML=`<div class="card"><h2>${page}</h2><div class="empty">${page} page is ready for your next integration step.<br><br><button class="btn login" onclick="show('Home')">Back to Home</button></div></div>`}
function addBet(name,odd){document.getElementById('bets').innerHTML=`<b>${name}</b><br><br>Selected odds: <strong style="color:var(--green)">${odd}</strong><br><br><button class="btn login" onclick="toast('Demo bet slip — no real wager placed.')">Continue</button>`;toast('Selection added to demo bet slip')}
function modal(t){document.getElementById('modalTitle').innerText=t;document.getElementById('modal').classList.add('show')}function modalClose(){document.getElementById('modal').classList.remove('show')}function toast(t){let x=document.createElement('div');x.textContent=t;x.style='position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#10252d;border:1px solid #2b4a52;padding:12px 18px;border-radius:8px;z-index:50';document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}show('Home');
</script></body></html>
